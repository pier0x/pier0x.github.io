<!DOCTYPE html>
<html lang="en">
  <head>
    <title>music @ pier0x</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap"

    />
    <link href="main.css" rel="stylesheet" />

        <p class="pb-4">favorite albums:</p>

            <p class="pt-2">[<span class="underline">discovery</span>]</p>
            <p>daft punk</p>

          <a
            href="https://open.spotify.com/album/4m2880jivSbbyEGAKfITCa"

            />

            <p>daft punk</p>

          <a
